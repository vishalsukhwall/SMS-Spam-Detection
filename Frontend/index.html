<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Spam Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- mainContainer ID add kar di hai taaki JS poora box color change kar sake -->
<div class="container" id="mainContainer">
    <h2>💬 SMS Spam Detector</h2>
    <p class="subtitle">Analyze your messages here.</p>
    
    <textarea id="messageInput" placeholder="Type or paste your SMS text here..."></textarea>
    <button id="checkBtn">Analyze Message</button>

    <div id="result" class="result-box"></div>
</div>

<script src="script.js"></script>
</body>
</html>
